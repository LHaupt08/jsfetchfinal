<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDK Yet</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" async>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    <link href="./css/style.css" rel="stylesheet" />
    <script src="./js/types.js" async></script>
    <script src="./js/index.js" async></script>

</head>

<body>

    <!-- * Search Bar -->
    <div class="searchSelect mb-2">

        <select id="group">

            <option value="pokemon">POKEMON</option>

        </select>

        <select id="type" class="bg-secondary">

            <option value=""></option>
            <!--<option value="sprites">SPRITES</option>-->

        </select>

        <select id="name" class="bg-secondary">

            <option value=""></option>
            <!--<option value="front_default">DEFAULT (FRONT)</option><-->

        </select>

        <input type="search" size="40" id="search">
        <input type="submit" onclick="getData()" id="submit" class="text-uppercase">

    </div>



    <div class="container-fluid p-0">

        <div class="row py-1">



            <!-- * Pokemon Display -->
            <div class="col-4 text-light bg-secondary rounded-1 pokedisplay">

                <div class="pokeimg d-flex justify-content-center bg-primary rounded-4 mx-1">

                    <img alt="Pokemon Image" style="display:none" id="pokeimg">

                </div>

                <h2 id="pokedexNum" class="text-center"></h2>
                <h2 id="pokeName" class="text-capitalize text-center"></h2>

            </div>



            <!-- * Pokemon Stats -->
            <div class="col-3 text-light bg-secondary rounded-1 pokedisplay mx-1 d-flex flex-column justify-content-evenly ps-0">


                <div class="row w-auto">

                    <div class="col-2 p-0">

                        <p class="m-0 me-1 stats">HP:</p>

                    </div>

                    <div class="col-10 p-0">

                        <div class="progress mt-2" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="hpbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">

                    <div class="col-2 p-0">

                        <p class="m-0 me-1 stats">ATK:</p>

                    </div>

                    <div class="col-10 p-0">

                        <div class="progress mt-2" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="atkbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">
                    
                    <div class="col-2 p-0">

                        <p class="m-0 me-1 stats">DEF:</p>

                    </div>

                    <div class="col-10 p-0">

                        <div class="progress mt-2" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="defbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">

                    <div class="col-2 p-0">

                        <p class="m-0 me-1 stats">SAT:</p>

                    </div>

                    <div class="col-10 p-0">

                        <div class="progress mt-2" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="satbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">

                    <div class="col-2 p-0">

                        <p class="m-0 me-1 stats">SDF:</p>

                    </div>

                    <div class="col-10 p-0">

                        <div class="progress mt-2" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="sdfbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">

                    <div class="col-2 p-0">

                        <p class="m-0 me-1 stats">SPD:</p>

                    </div>

                    <div class="col-10 p-0">

                        <div class="progress mt-2" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="spdbar"></div>
                        </div>

                    </div>
                    
                </div>




                <div class="row w-auto">

                    <div class="col-2 p-0">

                        <p class="m-0 me-1 stats">BST:</p>

                    </div>

                    <div class="col-10 p-0">

                        <div class="progress mt-2" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="780">
                            <div class="progress-bar" id="bstbar" style="width: 0%"></div>
                        </div>

                    </div>
                    
                </div>




            </div>



            <div class="col-5 bg-secondary rounded-1 pokedisplay d-flex align-items-center px-0">

                <div id="carouselExample" class="carousel slide mx-1 w-100">
                    <div class="carousel-indicators slidebutton">
                        <!-- !Need to insert data here-->
                        <button type="button" data-bs-target="#carouselExample" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1" id="slide-1"></button>
                        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1" aria-label="Slide 2" id="slide-2"></button>
                        <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2" aria-label="Slide 3" id="slide-3"></button>

                    </div>

                    
                    <div class="carousel-inner">

                        
                        <div class="carousel-item active">
                            <img src="./img/pose.png" class="d-block w-100 carousel-img" alt="..." style="opacity: 0.5;">
                            <div class="carousel-caption d-none d-md-block">
                                <h5 id="label-1" class="text-capitalize"></h5>
                                <p id="content-1"></p>
                            </div>
                        </div>
                        
                        <div class="carousel-item">
                            <img src="./img/pose.png" class="d-block w-100 carousel-img" alt="..." style="opacity: 0.5;">
                            <div class="carousel-caption d-none d-md-block">
                                <h5 id="label-2" class="text-capitalize"></h5>
                                <p id="content-2"></p>
                            </div>
                        </div>

                        <div class="carousel-item">
                            <img src="./img/pose.png" class="d-block w-100 carousel-img" alt="..." style="opacity: 0.5;">
                            <div class="carousel-caption d-none d-md-block">
                                <h5 id="label-3" class="text-capitalize"></h5>
                                <p id="content-3"></p>
                            </div>
                        </div>

                    </div>

                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>

                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>

                </div>

            </div>

        </div>

        <div class="row py-1">

            <div class="col-4 bg-secondary text-light rounded-1">

                <div class="row">

                    <div class="col-6">

                        <div class="row">

                            <div class="col-8">

                                <p class="fs-3 my-0 text-capitalize" id="typeText-1">N/A</p>

                            </div>

                            <div class="col-4">

                                <img src="" alt="..." id="typeImg-1" />

                            </div>

                        </div>

                    </div>

                    <div class="col-6">

                        <div class="row">

                            <div class="col-8">

                                <p class="fs-3 my-0 text-capitalize" id="typeText-2">N/A</p>

                            </div>

                            <div class="col-4">

                                <img src="" alt="..." id="typeImg-2" />

                            </div>

                        </div>
                        
                    </div>

                </div>

            </div>


            <div class="col-8">

            </div>

        </div>

    </div>




</body>

</html>
