<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDK Yet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

    <link href="./css/style.css" rel="stylesheet" />
    <script src="./js/index.js" async></script>

</head>

<body>

    <!-- * Search Bar -->
    <div class="searchSelect mb-2">

        <select id="group">

            <option value="pokemon">POKEMON</option>

        </select>

        <select id="type" class="bg-secondary">

            <option value=""></option>
            <!--<option value="sprites">SPRITES</option>-->

        </select>

        <select id="name" class="bg-secondary">

            <option value=""></option>
            <!--<option value="front_default">DEFAULT (FRONT)</option><-->

        </select>

        <input type="search" size="40" id="search">
        <input type="submit" onclick="getData()" id="submit" class="text-uppercase">

    </div>



    <div class="container-fluid p-0">

        <div class="row">



            <!-- * Pokemon Display -->
            <div class="col-4 text-light bg-secondary rounded-1 pokedisplay">

                <div class="pokeimg d-flex justify-content-center bg-primary rounded-4 mx-1">

                    <img alt="Pokemon Image" style="display:none" id="pokeimg">

                </div>

                <h2 id="pokedexNum" class="text-center"></h2>
                <h2 id="pokeName" class="text-capitalize text-center"></h2>

            </div>



            <!-- * Pokemon Stats -->
            <div class="col-3 text-light bg-secondary rounded-1 pokedisplay mx-1 d-flex flex-column justify-content-evenly">


                <div class="row w-auto">

                    <div class="col-1 p-0">

                        <p class="m-0">HP:</p>

                    </div>

                    <div class="col-11 p-0">

                        <div class="progress mt-1" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="hpbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">

                    <div class="col-1 p-0">

                        <p class="m-0">ATK:</p>

                    </div>

                    <div class="col-11 p-0">

                        <div class="progress mt-1" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="atkbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">
                    
                    <div class="col-1 p-0">

                        <p class="m-0">DEF:</p>

                    </div>

                    <div class="col-11 p-0">

                        <div class="progress mt-1" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="defbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">

                    <div class="col-1 p-0">

                        <p class="m-0">SAT:</p>

                    </div>

                    <div class="col-11 p-0">

                        <div class="progress mt-1" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="satbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">

                    <div class="col-1 p-0">

                        <p class="m-0">SDF:</p>

                    </div>

                    <div class="col-11 p-0">

                        <div class="progress mt-1" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="sdfbar"></div>
                        </div>

                    </div>
                    
                </div>


                <div class="row w-auto">

                    <div class="col-1 p-0">

                        <p class="m-0">SPD:</p>

                    </div>

                    <div class="col-11 p-0">

                        <div class="progress mt-1" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="250">
                            <div class="progress-bar" style="width: 0%" id="spdbar"></div>
                        </div>

                    </div>
                    
                </div>




                <div class="row w-auto">

                    <div class="col-1 p-0">

                        <p class="m-0">BST:</p>

                    </div>

                    <div class="col-11 p-0">

                        <div class="progress mt-1" role="progressbar" aria-label="Example with label" aria-valuenow="0" aria-valuemin="0" aria-valuemax="720">
                            <div class="progress-bar" id="bstbar" style="width: 0%"></div>
                        </div>

                    </div>
                    
                </div>




            </div>



            <div class="col-5 text-light bg-secondary rounded-1 pokedisplay mx-1">

            </div>

        </div>

    </div>




</body>

</html>
